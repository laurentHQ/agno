[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-news-agentos"
version = "1.0.0"
description = "Finance News AgentOS - AI-powered financial analysis and reporting"
readme = "docs/README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Finance News AgentOS Team"}
]
keywords = ["ai", "finance", "news", "agentos", "claude", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"

[tool.ruff]
# Ruff configuration for Finance News AgentOS
target-version = "py311"
line-length = 100
indent-width = 4

# Files and directories to exclude
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "web/node_modules",
    "data/databases",
    "data/reports",
]

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]

# Disable specific rules that may be too strict for this project
ignore = [
    "E501",   # Line too long (handled by line-length setting)
    "S101",   # Use of assert (common in tests)
    "S603",   # subprocess without shell=False
    "S607",   # Starting a process with a partial executable path
    "T201",   # print statements (acceptable for CLI tools)
    "T203",   # pprint statements
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "N806",   # Variable name should be lowercase (for API responses)
    "RUF012", # Mutable class attributes should be annotated
    "UP007",  # Use X | Y for union types (Python 3.10+)
]

[tool.ruff.lint.isort]
# Group imports by type
force-single-line = false
force-sort-within-sections = true
known-first-party = ["src"]
split-on-trailing-comma = true

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line ending
line-ending = "auto"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.flake8-bandit]
# S104: Possible binding to all interfaces
# S108: Probable insecure usage of temp file/directory
check-typed-exception = true

[tool.ruff.lint.pylint]
# Maximum number of arguments for a function or method
max-args = 10
# Maximum number of local variables for function / method body
max-locals = 20
# Maximum number of branches for function / method body
max-branches = 15
# Maximum number of statements in function / method body
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Test files can use assert statements
"tests/*.py" = ["S101"]
# Scripts can use subprocess and print statements
"scripts/*.py" = ["S603", "S607", "T201"]
# Configuration files can have unused imports for re-exports
"src/__init__.py" = ["F401"]
"src/*/__init__.py" = ["F401"]
# Examples and tests can be more lenient
"tests/test_*.py" = ["S101", "PLR2004", "ARG001"]
"tests/*example*.py" = ["S101", "T201", "PLR2004"]

[tool.mypy]
# MyPy configuration for Finance News AgentOS
# Focused on catching critical type issues without being overly strict
python_version = "3.11"

# Basic type checking settings
warn_unused_configs = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true

# Display settings
pretty = true
show_error_codes = true
show_error_context = false

# Allow flexibility for this codebase
ignore_missing_imports = true
follow_imports = "silent"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_return_any = false
strict_equality = false

# Exclude specific directories and files
exclude = [
    "build/",
    "dist/",
    "venv/",
    ".venv/",
    "data/",
    "web/node_modules/",
    "scripts/",
    "tests/",
]

# Per-module overrides
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_errors = true

# Allow more flexibility in utility modules
[[tool.mypy.overrides]]
module = "src.utils.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false