version: '3.8'

services:
  finance-agentos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_HOST=redis
    volumes:
      - ../data/reports:/app/data/reports
      - ../data/databases:/app/data/databases
    depends_on:
      - postgres
    networks:
      - agentos-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: finance_agent
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agentos-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agentos-network

volumes:
  postgres_data:

networks:
  agentos-network:
    driver: bridge